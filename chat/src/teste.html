<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEBEL · Teste do atendimento</title>
<style>
  :root { --fundo:#ECE5DD; --topo:#0A459F; --eu:#DCF8C6; --ele:#FFFFFF; --txt:#111B21; --sub:#667781; --btn:#0A459F; }
  @media (prefers-color-scheme: dark) { :root { --fundo:#0B141A; --topo:#061A3F; --eu:#005C4B; --ele:#202C33; --txt:#E9EDEF; --sub:#8696A0; --btn:#53BDEB; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--fundo); color:var(--txt); height:100dvh; display:flex; flex-direction:column; }
  header { background:var(--topo); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  header b { display:block; } header small { opacity:.8; }
  header button { margin-left:auto; background:transparent; border:1px solid #fff6; color:#fff; border-radius:16px; padding:6px 12px; font:inherit; font-size:13px; }
  .bola { width:38px; height:38px; border-radius:50%; background:#fff; color:var(--topo); display:grid; place-items:center; font-weight:800; }
  main { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px; max-width:720px; width:100%; margin:0 auto; }
  .m { max-width:85%; padding:8px 10px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; box-shadow:0 1px .5px #0002; }
  .eu { align-self:flex-end; background:var(--eu); }
  .ele { align-self:flex-start; background:var(--ele); }
  .ele a { color:var(--btn); }
  .bts { align-self:flex-start; display:flex; flex-direction:column; gap:4px; width:min(85%, 320px); }
  .bts button { background:var(--ele); color:var(--btn); border:0; border-radius:10px; padding:9px; font:inherit; font-weight:600; cursor:pointer; box-shadow:0 1px .5px #0002; }
  .info { align-self:center; font-size:12px; color:var(--sub); background:var(--ele); padding:4px 10px; border-radius:8px; }
  form { display:flex; gap:8px; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); max-width:720px; width:100%; margin:0 auto; }
  input { flex:1; border:0; border-radius:22px; padding:12px 16px; font:inherit; background:var(--ele); color:var(--txt); }
  form button { border:0; border-radius:50%; width:46px; background:var(--topo); color:#fff; font-size:18px; }
</style>
</head>
<body>
<header><div class="bola">C</div><div><b>CEBEL</b><small id="estado">assistente de teste</small></div><button id="nova" type="button">Nova conversa</button></header>
<main id="chat"><div class="info">Teste do atendimento. Escreva como se fosse um cliente (PT, EN ou ES).</div></main>
<form id="f"><input id="t" placeholder="Mensagem" autocomplete="off" autofocus><button aria-label="Enviar">➤</button></form>
<script>
  const senha = new URLSearchParams(location.search).get("senha");
  let sessao; try { sessao = localStorage.getItem("cebel-teste") } catch (e) {}
  const novaSessao = () => { sessao = "t" + Date.now().toString(36); try { localStorage.setItem("cebel-teste", sessao) } catch (e) {} };
  if (!sessao) novaSessao();
  const chat = document.getElementById("chat"), t = document.getElementById("t"), estado = document.getElementById("estado");
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const links = (s) => esc(s).replace(/https?:\/\/[^\s)]+/g, (u) => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`).replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
  const add = (cls, html) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d; };
  async function mandar(texto, botao) {
    document.querySelectorAll(".bts").forEach((b) => b.remove());
    add("m eu", esc(texto));
    estado.textContent = "digitando…";
    try {
      const r = await fetch("/teste/msg?senha=" + encodeURIComponent(senha), { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ sessao, texto, botao }) });
      const j = await r.json();
      if (j.erro) add("info", "Erro: " + esc(j.erro));
      for (const s of j.saidas || []) {
        add("m ele", links(s.texto));
        const bts = (s.botoes || []).map((b) => ({ id: "Q:" + b, t: b }));
        if (!/robô em silêncio/.test(s.texto) && !/(chamei|called|llamé|avisei|notified|avisé)/i.test(s.texto)) bts.push({ id: "PESSOA", t: "👤 Falar com uma pessoa" });
        if (bts.length) {
          const box = add("bts", "");
          bts.forEach((b) => { const x = document.createElement("button"); x.textContent = b.t; x.onclick = () => mandar(b.t.replace("👤 ", ""), b.id); box.appendChild(x); });
        }
      }
    } catch (e) { add("info", "Sem conexão com o servidor"); }
    estado.textContent = "assistente de teste";
  }
  document.getElementById("f").onsubmit = (e) => { e.preventDefault(); const v = t.value.trim(); if (v) { t.value = ""; mandar(v); } };
  document.getElementById("nova").onclick = () => { novaSessao(); chat.innerHTML = '<div class="info">Nova conversa iniciada.</div>'; };
</script>
</body>
</html>
