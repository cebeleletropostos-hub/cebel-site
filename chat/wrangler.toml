name = "cebel-atendimento"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[durable_objects.bindings]]
name = "CONVERSA"
class_name = "Conversa"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Conversa"]

[observability]
enabled = true

# Configurações que não são secretas (as secretas vão em Settings → Variables and Secrets, como "Secret").
[vars]
SITE_URL = "https://cebeleletropostos-hub.github.io/cebel-site/"
MODEL = "claude-sonnet-5-5"
GRAPH_VERSION = "v23.0"
HORARIO_TEXTO = "segunda a sábado, das 8h às 20h"
HORA_INICIO = "8"
HORA_FIM = "20"
DIAS_ATENDIMENTO = "1,2,3,4,5,6"
HUMANO_HORAS = "12"
LEADS_ENDPOINT = "https://script.google.com/macros/s/AKfycbyd-twHaXwk75WesZLhxmKf0ufZ-BrJarvFHJc9PjARoOyhXEsEDDV3rTbHI_TaDM2J/exec"
LEADS_TOKEN = "cebel-leads"
