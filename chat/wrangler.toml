name = "cebel-atendimento"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[durable_objects.bindings]]
name = "CONVERSA"
class_name = "Conversa"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Conversa"]

[triggers]
crons = ["17 9 * * 1"]

[observability]
enabled = true

# Configurações que não são secretas (as secretas vão em Settings → Variables and Secrets, como "Secret").
[vars]
SITE_URL = "https://cebeleletropostos-hub.github.io/cebel-site/"
MODEL = "claude-sonnet-5-5"
GRAPH_VERSION = "v23.0"
HORARIO_TEXTO = "todos os dias, das 8h às 22h"
HORARIO_TEXTO_EN = "every day, 8 am to 10 pm"
HORARIO_TEXTO_ES = "todos los días, de 8 a 22 h"
HORA_INICIO = "8"
HORA_FIM = "22"
DIAS_ATENDIMENTO = "0,1,2,3,4,5,6"
HUMANO_HORAS = "12"
LEADS_ENDPOINT = "https://script.google.com/macros/s/AKfycbyd-twHaXwk75WesZLhxmKf0ufZ-BrJarvFHJc9PjARoOyhXEsEDDV3rTbHI_TaDM2J/exec"
LEADS_TOKEN = "cebel-leads"
