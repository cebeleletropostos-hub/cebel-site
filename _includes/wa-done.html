{% include t.html %}
<p class="err" hidden></p>
<div class="form-actions full">
  <button class="btn sol" type="submit">{% include icons.html i="wa" %}{{ include.botao | default: t.enviar_wa }}</button>
</div>
<p class="privacy">{{ t.privacy_form }} <a href="{{ t.p.privacidade | relative_url }}">{{ t.privacy_form_link }}</a></p>
<div class="done" hidden>
  <strong>{{ t.pronta }}</strong>
  <p>{{ t.pronta_txt }} {{ site.whatsapp_display }}.</p>
  <pre></pre>
  <div class="form-actions">
    <a class="btn azul wa-link" href="https://wa.me/{{ site.whatsapp }}" target="_blank" rel="noopener">{{ t.abrir_wa }}</a>
    <button class="btn linha copy" type="button">{{ t.copiar_msg }}</button>
  </div>
  {% if site.agenda_visita != "" %}<p class="book-next">{{ t.adiantar }} <a href="{{ site.agenda_visita }}" target="_blank" rel="noopener" data-track="agendar_visita">{{ t.adiantar_link }}</a>.</p>{% endif %}
</div>
