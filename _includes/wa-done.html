<p class="err" hidden></p>
<div class="form-actions full">
  <button class="btn sol" type="submit">{% include icons.html i="wa" %}{{ include.botao | default: "Enviar pelo WhatsApp" }}</button>
</div>
<p class="privacy">Seus dados só são usados para a CEBEL responder ao seu contato. <a href="{{ '/privacidade/' | relative_url }}">Privacidade</a></p>
<div class="done" hidden>
  <strong>Sua mensagem está pronta.</strong>
  <p>Toque em Abrir WhatsApp ou copie o texto e envie para {{ site.whatsapp_display }}.</p>
  <pre></pre>
  <div class="form-actions">
    <a class="btn azul wa-link" href="https://wa.me/{{ site.whatsapp }}" target="_blank" rel="noopener">Abrir WhatsApp</a>
    <button class="btn linha copy" type="button">Copiar mensagem</button>
  </div>
</div>
