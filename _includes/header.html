{% include t.html %}
{% unless page.ref == "parceiros" %}
<div class="topbar">
  <a href="{{ t.p.parceiros | relative_url }}"><span>{{ t.topbar }}<span class="long">{{ t.topbar_longo }}</span></span> <b>{{ t.topbar_cta }}</b></a>
</div>
{% endunless %}
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ t.p.home | relative_url }}" aria-label="{{ t.home_aria }}">
      <img src="{{ '/assets/img/logo-cebel.png' | relative_url }}" alt="" width="44" height="44">
      <span class="wm"><b>CEBEL</b><small>{{ t.marca_sub }}</small></span>
    </a>
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="lbl">{{ t.menu }}</span></button>
    <nav class="nav" id="nav" aria-label="Principal">
      {% for item in t.nav %}{% assign path = t.p[item[0]] %}
      <a href="{{ path | relative_url }}"{% if page.ref == item[0] %} aria-current="page"{% endif %}>{{ item[1] }}</a>
      {% endfor %}
      <a class="nav-cta" href="{{ t.p.parceiros | relative_url }}"{% if page.ref == "parceiros" %} aria-current="page"{% endif %}><span class="dot" aria-hidden="true"></span>{{ t.seja_parceiro }}</a>
      {% include lang-switch.html %}
    </nav>
  </div>
</header>
