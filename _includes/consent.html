{% include t.html %}
<div class="consent" role="region" aria-label="Cookies" hidden>
  <p>{{ t.consent }} <a href="{{ t.p.privacidade | relative_url }}">{{ t.consent_link }}</a>.</p>
  <div class="consent-actions">
    <button class="btn small linha consent-no" type="button">{{ t.recusar }}</button>
    <button class="btn small azul consent-yes" type="button">{{ t.aceitar }}</button>
  </div>
</div>
