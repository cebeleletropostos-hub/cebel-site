{% capture same %}{% if site.instagram != "" %}"{{ site.instagram }}",{% endif %}{% if site.linkedin != "" %}"{{ site.linkedin }}",{% endif %}{% if site.youtube != "" %}"{{ site.youtube }}",{% endif %}"https://wa.me/{{ site.whatsapp }}"{% endcapture %}
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
 {"@type":"Organization","@id":"{{ '/' | absolute_url }}#org","name":"CEBEL","alternateName":["{{ site.nome_completo }}","{{ site.sigla }}"],"legalName":"{{ site.razao_social }}","url":"{{ '/' | absolute_url }}","logo":"{{ '/assets/img/logo-cebel.png' | absolute_url }}","image":"{{ '/assets/img/og.png' | absolute_url }}","description":{{ site.description | jsonify }},"telephone":"+{{ site.whatsapp }}","areaServed":{"@type":"State","name":"Rio de Janeiro"},"sameAs":[{{ same }}],
  "contactPoint":[{"@type":"ContactPoint","telephone":"+{{ site.whatsapp }}","contactType":"customer service","availableLanguage":"Portuguese","areaServed":"BR"}]},
 {"@type":"WebSite","@id":"{{ '/' | absolute_url }}#site","url":"{{ '/' | absolute_url }}","name":"CEBEL","inLanguage":"pt-BR","publisher":{"@id":"{{ '/' | absolute_url }}#org"}}{% if page.url == "/" or page.url == "/estacoes/" %}{% assign ops = site.data.estacoes | where: "status", "operando" %}{% for st in ops %},

 {"@type":"NewsArticle","headline":{{ page.title | jsonify }},"datePublished":"{{ page.date | date_to_xmlschema }}","image":"{{ page.imagem | default: '/assets/img/og.png' | absolute_url }}","author":{"@id":"{{ '/' | absolute_url }}#org"},"publisher":{"@id":"{{ '/' | absolute_url }}#org"},"mainEntityOfPage":"{{ page.url | absolute_url }}"}{% endif %}
]}
</script>
