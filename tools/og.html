<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Mono:wght@500&display=swap">
<style>
body{margin:0;width:1200px;height:630px;background:#061A3F;color:#EEF3FB;position:relative;overflow:hidden;font-family:sans-serif}
.bg{position:absolute;inset:0;background:radial-gradient(60% 80% at 85% 10%,rgba(30,99,214,.6),transparent 60%),radial-gradient(50% 70% at 10% 100%,rgba(10,69,159,.7),transparent 65%)}
.in{position:absolute;inset:70px 80px 90px}
.e{font:500 22px "DM Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#F7C600;display:flex;align-items:center;gap:14px}
.e::before{content:"";width:40px;height:5px;border-radius:3px;background:linear-gradient(90deg,#138A47 0 33%,#F7C600 33% 66%,#0A459F 66%)}
h1{font:800 104px/0.98 "Bricolage Grotesque",sans-serif;letter-spacing:-.025em;margin:26px 0 0;max-width:820px}
.sw{position:relative;color:#1F1A00;padding:0 .14em;z-index:0;white-space:nowrap}
.sw::before{content:"";position:absolute;z-index:-1;inset:.12em -.02em .02em;background:linear-gradient(100deg,#F7C600,#E9D33A 45%,#B6DC7A);border-radius:.18em .5em .22em .6em;transform:skew(-6deg) rotate(-1.2deg)}
img{position:absolute;right:80px;top:70px;width:200px;height:200px;border-radius:50%;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.f{position:absolute;left:0;right:0;bottom:0;height:16px;background:linear-gradient(90deg,#138A47 0 33.3%,#F7C600 33.3% 66.6%,#0A459F 66.6%)}
</style></head><body><div class="bg"></div><img src="logo.png"><div class="in">
<p class="e">Recarga de carros elétricos · RJ</p>
<h1>Energia limpa onde você <span class="sw">já para.</span></h1>
</div><div class="f"></div></body></html>
